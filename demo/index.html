<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneFind demo source moved</title>
  <style>
    body { max-width: 680px; margin: 12vh auto; padding: 24px; font: 16px/1.6 system-ui, sans-serif; color: #151827; background: #f6f7fb; }
    main { padding: 28px; border: 1px solid #dfe2ec; border-radius: 18px; background: white; box-shadow: 0 18px 50px rgba(31,35,58,.09); }
    code { padding: 3px 6px; border-radius: 5px; background: #eeedff; }
  </style>
</head>
<body>
  <main>
    <h1>The OneFind UI now ships inside the Python package</h1>
    <p>This avoids missing assets in wheel installations. Start the local service to use the full interface:</p>
    <p><code>onefind index ./sample-data --db demo.db --embed</code><br>
       <code>onefind serve --db demo.db</code></p>
    <p>Then open <a href="http://127.0.0.1:8080/">http://127.0.0.1:8080/</a>.</p>
  </main>
</body>
</html>
