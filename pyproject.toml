[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrydb"
version = "0.1.0"
description = "Lexical, semantic, and hybrid search in a single SQLite file - reproduction of arXiv:2608.24060"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Major Project" }]
dependencies = [
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
model = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
scrydb = "scrydb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
